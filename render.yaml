# cv-builder-api - Blueprint de Render
# Sintaxis verificada contra la spec vigente de Render
# (https://render.com/docs/blueprint-spec y el JSON Schema
#  https://render.com/schema/render.yaml.json)
#
# `runtime: docker` sustituye a `env: docker`, que Render marco como obsoleto.
# `autoDeployTrigger` sustituye a `autoDeploy` (tambien obsoleto):
#   commit      -> despliegue en cada commit a la rama del servicio (default)
#   checksPass  -> solo si pasan los checks de CI
#   off         -> sin autodespliegue
# Se fija `commit` de forma explicita: el default de Render es ese, pero
# dejarlo escrito hace la intencion legible.

services:
  - type: web
    runtime: docker
    name: cv-builder-api
    # plan free = 0.1 CPU / 512 MB segun la tabla de la spec. Es MUCHO menos
    # de 0.5 CPU: pdflatex va a tardar bastante mas de lo que tarda en local.
    # Los 120s de --timeout del gunicorn y el 60s de timeout de compilacion de
    # app.py son el colchon para eso. Si en la practica se queda corto, el
    # siguiente paso es plan 0.5c-512mb (de pago).
    plan: free
    dockerfilePath: ./Dockerfile

    # NO se declara healthCheckPath a proposito. /health devuelve 503 cuando
    # hay una compilacion en curso o cuando falta API_KEY, y el health check de
    # Render interpretaria ese 503 como servicio unhealthy, pudiendo dejar el
    # deploy marcado como fallido. /health sigue existiendo: lo usa el ping del
    # frontend (js/latex-service.js), que trata 200 y 503 como "la API vive".

    # NO se declara PORT a proposito. Render inyecta su propia variable PORT para
    # saber a que puerto enrutar el trafico, y fijarla aqui lo sobrescribe:
    # el contenedor escucharia en el puerto del blueprint mientras Render espera
    # el suyo, y el servicio daria error de conexion estando sano. El Dockerfile
    # ya resuelve ambos casos: ENV PORT=5000 como default y el CMD hace
    # --bind 0.0.0.0:${PORT:-5000}, de modo que manda Render si define PORT.

    envVars:
      - key: ALLOWED_ORIGIN
        value: https://gambito700.github.io

        # SINCRONIZAR: `sync: false` pide el valor en el dashboard de Render la
        # primera vez. NO se escribe aqui: el valor viaja despues en el JS del
        # navegador, asi que no es un secreto, pero si debe ser largo y
        # aleatorio para que no se pueda adivinar. Generalo con:
        #   python -c "import secrets; print(secrets.token_urlsafe(32))"
      - key: API_KEY
        sync: false